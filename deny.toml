# cargo-deny policy. Rationale: docs/adr/0001-open-source-boundary.zh-CN.md §5.
# Dependencies must be compatible with the layered AGPL/Apache/CC-BY model.
# MPL-2.0 and LGPL require review; GPL/AGPL are allowed for this copyleft project.
# Apache contract crates are checked separately by scripts/check-apache-licenses.py.

[graph]
all-features = true

[advisories]
# Unmaintained or vulnerable crates fail the advisories check.
ignore = []

[licenses]
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.93
# The allow list is the policy, not a list of what is currently used.
unused-allowed-license = "allow"
# Per-crate exceptions (e.g. MPL-2.0) go here, each with a comment saying why.
exceptions = []

[licenses.private]
# Workspace crates are not published yet; their license is still checked.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
