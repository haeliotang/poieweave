name: Desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/desktop/src/**"
      - "apps/desktop/tests/**"
      - "apps/desktop/playwright.config.ts"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/tests/**"
      - "apps/desktop/playwright.config.ts"
      - "apps/desktop/index.html"
      - "apps/desktop/package.json"
      - "apps/desktop/pnpm-lock.yaml"
      - "apps/desktop/tsconfig.json"
      - "apps/desktop/vite.config.ts"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "apps/desktop/src/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/index.html"
      - "apps/desktop/package.json"
      - "apps/desktop/pnpm-lock.yaml"
      - "apps/desktop/tsconfig.json"
      - "apps/desktop/vite.config.ts"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            bundles: deb
          - name: windows-x86_64
            os: windows-latest
            bundles: nsis
          - name: macos-universal
            os: macos-latest
            bundles: app
            target_args: "--target universal-apple-darwin"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Add Intel target for universal macOS
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: Host tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build desktop bundles
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          SIGN=""
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            SIGN="--no-sign"
          fi
          pnpm tauri build --ci ${{ matrix.target_args }} --bundles ${{ matrix.bundles }} $SIGN

      - name: Package universal macOS app
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Poieweave.app \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/Poieweave_${VERSION}_universal.app.zip"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poieweave-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/Poieweave
            apps/desktop/src-tauri/target/release/Poieweave.exe
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.zip

  ui-smoke:
    name: UI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Browser UI smoke (Playwright + Chrome)
        working-directory: apps/desktop
        run: pnpm test:ui
      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore
  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: poieweave-desktop-*
          path: release-assets
      - name: Attach installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "Poieweave ${GITHUB_REF_NAME}" --generate-notes
          fi
          find release-assets -type f \( -name '*.deb' -o -name '*.exe' -o -name '*.zip' \) -print0 \
            | xargs -0 gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
          cd release-assets
          find . -type f \( -name '*.deb' -o -name '*.exe' -o -name '*.zip' \) -print0 \
            | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber
          VERSION="${GITHUB_REF_NAME#v}"
          python3 ../scripts/verify_release.py             --artifacts . --expected-version "${VERSION}" --tag "${GITHUB_REF_NAME}"             --output release-verification.json
          gh release upload "${GITHUB_REF_NAME}" release-verification.json --repo "${GITHUB_REPOSITORY}" --clobber
