# Quality gates from docs/DEVELOPMENT.zh-CN.md §1.3 and the dependency-license
# policy from docs/adr/0001-open-source-boundary.zh-CN.md §5.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test, Base-01
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Ontology SDK drift
        run: cargo run --locked -q -p poie-sdkgen -- --check
      - name: Schema registry
        run: python3 scripts/check-schema-registry.py
      - name: Agent eval fixtures
        run: python3 scripts/check-agent-evals.py
      - name: rustdoc (warnings as errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --offline
      - name: Markdown relative links
        run: python3 scripts/check-docs.py
      - name: Test matrix counts
        run: python3 scripts/check-test-matrix.py
      - name: Release verifier tests
        working-directory: scripts
        run: python3 -m unittest -q test_verify_release.py test_signing_custody_card.py test_platform_qa_check.py
      - name: Experiment replay coverage
        run: python3 scripts/check-experiment-replays.py
      - name: H2b development diagnostic replay
        run: |
          cargo run --locked -q -p poie-h2b-joint-planning -- --dev --diagnose --write /tmp/h2b-replay > /tmp/h2b-replay.out
          diff experiments/h2b-joint-planning/raw/dev-raw.txt /tmp/h2b-replay/raw/dev-raw.txt
          diff experiments/h2b-joint-planning/dev-report.md /tmp/h2b-replay/dev-report.md
          diff experiments/h2b-joint-planning/raw/dev-diagnose.txt /tmp/h2b-replay.out
          test -f experiments/h2b-joint-planning/raw/dev-base01-invalid.txt
      - name: H2c development diagnostic replay
        run: |
          cargo run --locked -q -p poie-h2c-joint-planning -- --dev --diagnose --write /tmp/h2c-replay > /tmp/h2c-replay.out
          diff experiments/h2c-joint-planning/raw/dev-raw.txt /tmp/h2c-replay/raw/dev-raw.txt
          diff experiments/h2c-joint-planning/dev-report.md /tmp/h2c-replay/dev-report.md
          diff experiments/h2c-joint-planning/raw/dev-diagnose.txt /tmp/h2c-replay.out
      - name: H2c holdout replay
        run: |
          cargo run --locked -q -p poie-h2c-joint-planning -- --holdout --write /tmp/h2c-holdout
          diff experiments/h2c-joint-planning/raw/holdout-raw.txt /tmp/h2c-holdout/raw/holdout-raw.txt
          diff experiments/h2c-joint-planning/holdout-report.md /tmp/h2c-holdout/holdout-report.md
          test -f experiments/h2c-joint-planning/REPORT.md
      - name: M9 simulated bench loop
        run: |
          cargo run --locked -q -p poie-m9-bench-loop > /tmp/m9-bench.out
          diff experiments/m9-bench-loop/expected.txt /tmp/m9-bench.out
          test -f experiments/m9-bench-loop/REPORT.md
      - name: M9 bench v2 settling/watchdog
        run: |
          cargo run --locked -q -p poie-m9-bench-v2 > /tmp/m9-bench-v2.out
          diff experiments/m9-bench-v2/expected.txt /tmp/m9-bench-v2.out
          test -f experiments/m9-bench-v2/REPORT.md
      - name: M9 Modbus TCP virtual slave
        run: |
          cargo run --locked -q -p poie-m9-modbus > /tmp/m9-modbus.out
          diff experiments/m9-modbus/expected.txt /tmp/m9-modbus.out
          test -f experiments/m9-modbus/REPORT.md
      - name: S1 recursive capability closure
        run: |
          cargo run --locked -q -p poie-viability --bin poie-closure > /tmp/s1-closure.out
          diff experiments/s1-capability-closure/expected.txt /tmp/s1-closure.out
          test -f experiments/s1-capability-closure/REPORT.md
      - name: S2 failure-envelope coverage (Base-05)
        run: |
          cargo run --locked -q -p poie-viability --bin poie-survival > /tmp/s2-envelope.out
          diff experiments/s2-failure-envelope/expected.txt /tmp/s2-envelope.out
          test -f experiments/s2-failure-envelope/REPORT.md
      - name: S2 long-horizon repeated failures (Base-05)
        run: |
          cargo run --locked -q -p poie-viability --bin poie-longevity > /tmp/s2-longevity.out
          diff experiments/s2-long-horizon/expected.txt /tmp/s2-longevity.out
          test -f experiments/s2-long-horizon/REPORT.md
      - name: S2 survival-horizon curve (Base-05)
        run: |
          cargo run --locked -q -p poie-viability --bin poie-horizon > /tmp/s2-horizon.out
          diff experiments/s2-survival-horizon/expected.txt /tmp/s2-horizon.out
          test -f experiments/s2-survival-horizon/REPORT.md
      - name: S2 double-failure envelope (Base-05)
        run: |
          cargo run --locked -q -p poie-viability --bin poie-pairs > /tmp/s2-pairs.out
          diff experiments/s2-failure-pairs/expected.txt /tmp/s2-pairs.out
          test -f experiments/s2-failure-pairs/REPORT.md
      - name: S2 joint double-failure conflict (Base-06)
        run: |
          cargo run --locked -q -p poie-viability --bin poie-joint > /tmp/s2-joint.out
          diff experiments/s2-joint-double-failure/expected.txt /tmp/s2-joint.out
          test -f experiments/s2-joint-double-failure/REPORT.md
      - name: S2 joint coverage comparison (Base-06)
        run: |
          cargo run --locked -q -p poie-viability --bin poie-joint-coverage > /tmp/s2-joint-coverage.out
          diff experiments/s2-joint-coverage/expected.txt /tmp/s2-joint-coverage.out
          test -f experiments/s2-joint-coverage/REPORT.md
      - name: S2 resupply sensitivity (Base-06)
        run: |
          cargo run --locked -q -p poie-viability --bin poie-resupply > /tmp/s2-resupply.out
          diff experiments/s2-resupply/expected.txt /tmp/s2-resupply.out
          test -f experiments/s2-resupply/REPORT.md

      - name: Python model and bridge tests (M7)
        run: python3 -m unittest discover -s python/poie_models -p "test_*.py" -v
      - name: REUSE compliance
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse-venv"
          "$RUNNER_TEMP/reuse-venv/bin/pip" install -q reuse==6.3.0
          "$RUNNER_TEMP/reuse-venv/bin/reuse" lint
      - name: Apache contract dependency licences
        run: python3 scripts/check-apache-licenses.py
      - name: Base-01 pre-registered cases
        run: cargo run --locked -q -p poie-ontology --bin poie-graph -- scenarios/base-01/cases.toml

      - name: Base-02 pre-registered cases
        run: cargo run --locked -q -p poie-ontology --bin poie-graph -- scenarios/base-02/cases.toml

      - name: M12 federation partition simulation
        run: |
          cargo run --locked -q -p poie-federation-partition -- --write /tmp/fed
          diff /tmp/fed/REPORT.sim.md experiments/federation-partition/REPORT.sim.md
          diff /tmp/fed/raw/partition.txt experiments/federation-partition/raw/partition.txt

      - name: End-to-end pipeline demo
        run: |
          cargo run --locked -q -p poie-e2e -- --write /tmp/e2e
          diff /tmp/e2e/REPORT.md experiments/e2e-pipeline/REPORT.md
          diff /tmp/e2e/raw/trace.txt experiments/e2e-pipeline/raw/trace.txt

      - name: Localhost TCP federation demo
        run: |
          cargo run --locked -q -p poie-federation-tcp -- --write /tmp/fed-tcp
          diff /tmp/fed-tcp/REPORT.md experiments/federation-tcp/REPORT.md
          diff /tmp/fed-tcp/raw/exchange.txt experiments/federation-tcp/raw/exchange.txt

      - name: Two-container partition preview (judgment replay from live raw)
        run: |
          mkdir -p /tmp/fed-docker
          cargo run --locked -q -p poie-federation-docker -- report --raw experiments/federation-docker/raw --write /tmp/fed-docker > /dev/null
          diff /tmp/fed-docker/REPORT.md experiments/federation-docker/REPORT.md

      - name: Two-site shadow integration
        run: |
          cargo run --locked -q -p poie-two-site-shadow -- --write /tmp/two-site
          diff /tmp/two-site/REPORT.md experiments/two-site-shadow/REPORT.md
          diff /tmp/two-site/raw/trace.txt experiments/two-site-shadow/raw/trace.txt

      - name: Shadow run demo (M9.4)
        run: |
          cargo run --locked -q -p poie-shadow-run -- --write /tmp/shadow
          diff /tmp/shadow/REPORT.md experiments/shadow-run/REPORT.md
          diff /tmp/shadow/raw/trace.txt experiments/shadow-run/raw/trace.txt

      - name: Base-01 timed cases and replay digests
        run: |
          cargo run --locked -q -p poie-sim --bin poie-timed -- scenarios/base-01-timed/cases.toml
          cargo run --locked -q -p poie-sim --bin poie-timed -- scenarios/base-01-timed/cases.toml --check-digests scenarios/base-01-timed/digests.toml

      - name: Base-01 v0.2 VEC report (M6)
        run: cargo run --locked -q -p poie-vec-base01 -- scenarios/base-01-timed/cases.toml --check experiments/vec-base01/report.toml

      - name: H3 simulated bounded execution (M10)
        run: |
          cargo run --locked -q -p poie-h3-bounded-execution -- --write /tmp/h3-sim
          diff /tmp/h3-sim/REPORT.sim.md experiments/h3-bounded-execution/REPORT.sim.md
          diff /tmp/h3-sim/raw/sim.txt experiments/h3-bounded-execution/raw/sim.txt

      - name: H4 expansion accounting (M11)
        run: |
          cargo run --locked -q -p poie-h4-expansion -- --write /tmp/h4
          diff /tmp/h4/REPORT.md experiments/h4-expansion/REPORT.md
          diff /tmp/h4/raw/h4.txt experiments/h4-expansion/raw/h4.txt

      - name: H1 structural replay
        run: |
          cargo run --locked -q -p poie-h1-baseline -- scenarios/base-01/cases.toml > /tmp/h1-all.txt
          diff /tmp/h1-all.txt experiments/h1-structural/raw/final-all-2026-10-31.txt
          dev=$(awk -F'\t' 'NR>1 && $1 ~ /^S[0-9]+$/ {print $1}' experiments/h1-structural/raw/dev-2026-10-31.txt | tr '\n' ' ')
          cargo run --locked -q -p poie-h1-baseline -- scenarios/base-01/cases.toml $dev > /tmp/h1-dev.txt
          diff /tmp/h1-dev.txt experiments/h1-structural/raw/dev-2026-10-31.txt
          holdout=$(awk -F'\t' 'NR>1 && $1 ~ /^S[0-9]+$/ {print $1}' experiments/h1-structural/raw/final-holdout-2026-10-31.txt | tr '\n' ' ')
          cargo run --locked -q -p poie-h1-baseline -- scenarios/base-01/cases.toml $holdout > /tmp/h1-holdout.txt
          diff /tmp/h1-holdout.txt experiments/h1-structural/raw/final-holdout-2026-10-31.txt

      - name: H1 temporal replay
        run: |
          cargo run --locked -q -p poie-h1-temporal -- scenarios/base-01-timed/cases.toml > /tmp/h1-temporal.txt
          diff /tmp/h1-temporal.txt experiments/h1-temporal/raw/dev-2026-11-01.txt

      - name: H2 development replay
        run: |
          cargo run --locked -q -p poie-h2-joint-planning -- --dev --write /tmp/h2-dev
          diff /tmp/h2-dev/dev-report.md experiments/h2-joint-planning/dev-report.md
          diff /tmp/h2-dev/raw/dev-raw.txt experiments/h2-joint-planning/raw/dev-raw.txt

      - name: H2 holdout replay (reproducibility only)
        run: |
          cargo run --locked -q -p poie-h2-joint-planning -- --holdout --write /tmp/h2-holdout
          diff /tmp/h2-holdout/holdout-report.md experiments/h2-joint-planning/holdout-report.md
          diff /tmp/h2-holdout/raw/holdout-raw.txt experiments/h2-joint-planning/raw/holdout-raw.txt

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - licenses bans sources
          - advisories
    # A newly published advisory should be visible without blocking unrelated work.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
