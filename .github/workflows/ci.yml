      - name: Run canonical N5 scheduling
        run: cargo run --locked -q -p poie-viability --bin poie-s5v-n5-canonical
      - name: Execute independent scheduler cases
        run: |
          run_case() {
            cid="$1"; mode="$2"; robots="$3"; failure="$4"; failure_robot="$5"
            external/fmu-n5-scheduler/build/harness external/fmu-n5-scheduler/poie-n5-scheduler.fmu 900 "$mode" "$robots" "$failure" "$failure_robot" 72000 "audit/phase5/external/$cid-harness-900.csv"
            python3 audit/phase5/fmpy_import.py --step 900 --task-mode "$mode" --robots "$robots" --failure-time "$failure" --failure-robot "$failure_robot" --stop 72000 --output "audit/phase5/external/$cid-fmpy-900.csv" --log "audit/phase5/external/$cid-fmpy.log"
          }
          run_case N5-00 0 1 -1 0
          run_case N5-01 1 1 -1 0
          run_case N5-02 1 2 -1 0
          run_case N5-03 1 2 7200 1
          run_case N5-04 0 2 7200 2
      - name: Compare decisions, contracts and negative controls
        run: |
          python3 audit/phase5/compare.py
          python3 audit/phase5/cross_importer.py
          python3 audit/phase5/negative_controls.py
