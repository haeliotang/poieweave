  s5v-fmu-linux:
    name: S5-V external FMU Linux conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent FMI importer
        run: python3 -m pip install --disable-pip-version-check fmpy==0.3.32
      - name: Build standard FMU
        run: |
          external/fmu-pv-battery/build.sh
          external/fmu-pv-battery/build-tampered.sh
          external/fmu-pv-battery/build-tampered-duration.sh
      - name: Independent fmpy importer
        run: |
          mkdir -p "$RUNNER_TEMP/s5v-linux"
          python3 audit/phase2/fmpy_import.py --fmu external/fmu-pv-battery/poie-pv-battery.fmu --output "$RUNNER_TEMP/s5v-linux/fmpy-linux.csv" --log "$RUNNER_TEMP/s5v-linux/fmpy-linux.log"
      - name: Execute and compare current Linux run
        run: |
          python3 audit/phase2/compare.py             --fmpy-csv "$RUNNER_TEMP/s5v-linux/fmpy-linux.csv"             --fmpy-log "$RUNNER_TEMP/s5v-linux/fmpy-linux.log"
      - name: Save Linux evidence bindings
        run: |
          mkdir -p "$RUNNER_TEMP/s5v-linux/evidence"
          cp audit/phase2/result.json "$RUNNER_TEMP/s5v-linux/evidence/result.json"
          cp external/fmu-pv-battery/poie-pv-battery.fmu "$RUNNER_TEMP/s5v-linux/evidence/poie-pv-battery-linux.fmu"
          cp audit/phase2/results/fmu-coarse-3600.csv "$RUNNER_TEMP/s5v-linux/evidence/harness-coarse.csv"
          cp "$RUNNER_TEMP/s5v-linux/fmpy-linux.csv" "$RUNNER_TEMP/s5v-linux/evidence/fmpy-coarse.csv"
          cp "$RUNNER_TEMP/s5v-linux/fmpy-linux.log" "$RUNNER_TEMP/s5v-linux/evidence/fmpy.log"
          cp audit/phase2/canonical-reference.txt "$RUNNER_TEMP/s5v-linux/evidence/canonical-reference.txt"
          cp audit/phase2/canonical-trajectory.csv "$RUNNER_TEMP/s5v-linux/evidence/canonical-trajectory.csv"
          ( cd "$RUNNER_TEMP/s5v-linux/evidence" && sha256sum * > SHA256SUMS.txt )
          cat "$RUNNER_TEMP/s5v-linux/evidence/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: s5v-linux-evidence
          path: ${{ runner.temp }}/s5v-linux/evidence
          if-no-files-found: error

  s5v-n4-linux:
    name: S5-V N4 discrete-event Linux conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Install independent FMI importer
        run: python3 -m pip install --disable-pip-version-check fmpy==0.3.32
      - name: Build N4 FMUs
        run: |
          external/fmu-n4-pv-battery/build.sh
          external/fmu-n4-pv-battery/build-harness.sh
          external/fmu-n4-pv-battery/build-negative.sh regen
          external/fmu-n4-pv-battery/build-negative.sh duration
          external/fmu-n4-pv-battery/build-negative.sh order
          external/fmu-n4-repair/build.sh
          external/fmu-n4-repair/build-harness.sh
      - name: Run canonical N4 events
        run: cargo run --locked -q -p poie-viability --bin poie-s5v-n4-canonical
      - name: Execute independent FMU cases
        run: |
          run_case() {
            case "$1" in
              N4-00) fail=-1;;
              N4-01) fail=7200;;
              N4-02) fail=4500;;
              N4-03) fail=10800;;
              *) echo "unknown case $1"; exit 1;;
            esac
            for step in 3600 900 1000; do
              external/fmu-n4-pv-battery/build/harness external/fmu-n4-pv-battery/poie-n4-pv-battery.fmu "$step" "$fail" 72000 "audit/phase4/results/$1-harness-$step.csv"
              python3 audit/phase4/fmpy_import.py --step "$step" --failure "$fail" --stop 72000 --output "audit/phase4/results/$1-fmpy-$step.csv" --log "audit/phase4/external/$1-fmpy-$step.log"
            done
          }
          run_case N4-00
          run_case N4-01
          run_case N4-02
          run_case N4-03
          external/fmu-n4-repair/build/harness external/fmu-n4-repair/poie-n4-repair.fmu 900 -1 7200 72000 audit/phase4/repair/N4-05-harness-900.csv
          python3 audit/phase4/fmpy_repair.py --step 900 --robot-failure 7200 --output audit/phase4/repair/N4-05-fmpy-900.csv --log audit/phase4/repair/N4-05-fmpy.log
          python3 audit/phase4/fmpy_repair.py --step 900 --robot-failure 10800 --output audit/phase4/repair/N4-05-failure-delayed.csv --log audit/phase4/repair/N4-05-failure-delayed.log
          python3 audit/phase4/fmpy_repair.py --step 900 --robot-failure -1 --output audit/phase4/repair/N4-05-failure-ignored.csv --log audit/phase4/repair/N4-05-failure-ignored.log
      - name: Run event comparator, steps and negative controls
        run: |
          python3 audit/phase4/compare.py
          python3 audit/phase4/step_sensitivity.py
          python3 audit/phase4/cross_importer.py
          python3 audit/phase4/event_evidence.py
          external/fmu-n4-pv-battery/build/harness external/fmu-n4-pv-battery/poie-n4-pv-battery.fmu 3600 10800 72000 audit/phase4/negative-controls/N4-01-failure-delayed.csv
