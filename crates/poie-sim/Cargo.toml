[package]
name = "poie-sim"
version = "0.1.0"
description = "Discrete-event simulation for Poieweave: deterministic ordering, per-step conservation, disturbance trajectories and battery power limits."
edition.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true

[dependencies]
poie-ontology = { path = "../poie-ontology", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
toml = "0.8"
