[package]
name = "poie-whatif"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C1 deterministic static what-if snapshots, Patch variants, structure/plan outcomes and compare"

[dependencies]
poie-digest = { path = "../poie-digest", version = "0.1.0" }
poie-ontology = { path = "../poie-ontology", version = "0.1.0" }
poie-plan = { path = "../poie-plan", version = "0.1.0" }
poie-state = { path = "../poie-state", version = "0.1.0" }
poie-objects = { path = "../poie-objects", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
